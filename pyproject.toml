[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [
    ".venv",
    ".venv.broken314",
    ".tmp_ruff",
    "_docx_preview",
    "_pdf_preview",
    "_ppt_preview",
    "storage",
    "frontend",
    "scripts/migrate_*",
    "flipus_local.db*",
]

[tool.ruff.lint]
# Pragmatic baseline — FASE 3 Sprint 4
# Enables: pycodestyle (E/W), pyflakes (F), isort (I), bugbear (B),
#          comprehensions (C4), security (S), print (T20)
select = ["E", "W", "F", "I", "B", "C4", "S", "T20", "UP"]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # do not perform function call in argument defaults — common FastAPI pattern
    "S101",   # assert — used in tests
    "S104",   # hardcoded bind to all interfaces — needed for LAN/dev
    "S105",   # possible hardcoded password — false positives on key names
    "S106",   # possible hardcoded password — false positives
    "S301",   # pickle — only used in trusted local scripts if any
    "S311",   # pseudo-random — non-crypto
    "S324",   # insecure hash — bcrypt used elsewhere
    "UP015",  # unnecessary open mode param — non-issue
    "UP032",  # use f-string instead of format — non-issue
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "B011", "S110"]  # noqa: S110 — try-except-pass acceptable in test reset/cleanup hooks
"scripts/**/*.py" = ["T201", "S101", "S105"]
"app/core/logging_config.py" = ["T201"]  # formatter emits via logging, not print
# Models pakai `Optional[T]` (bukan `T | None`) untuk konsistensi dengan
# service/api code base. Lihat commit S4-E (audit FASE 3).
"app/models/*.py" = ["UP007"]
"app/models/__init__.py" = ["UP007"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
# FASE 3 Sprint 4 baseline — pragmatic, not strict
python_version = "3.11"
mypy_path = "app"
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = false           # gradual: not required in defs
disallow_incomplete_defs = false        # gradual
check_untyped_defs = false              # gradual
no_implicit_reexport = false            # gradual
strict_optional = true                  # only this one is strict
show_error_codes = true
show_column_numbers = true
pretty = true
color_output = true
exclude = [
    ".venv",
    ".venv.broken314",
    ".tmp_ruff",
    "frontend",
    "scripts/migrate_",
    "storage",
    "tests/",
    "docs/",
]

# ----------------------------------------------------------------------------
# FASE 3 Sprint 4 (S4-D.R1 + S4-E) — Per-module mypy overrides
# ----------------------------------------------------------------------------
# LEGACY_FILES: 38 modules masih pakai SQLAlchemy `Column[T]` legacy pattern
# (vs SQLAlchemy 2.0 `Mapped[T]`). Pre-S4-D baseline: 658 mypy errors, 89% dari
# `arg-type` + `assignment` di Column[T] vs T. 9% sisanya (unreachable, index,
# union-attr, dll) adalah bug nyata dan SUDAH DIPERBAIKI inline (~9 fixed).
# Strategi: suppress arg-type + assignment HANYA di legacy modules, pertahankan
# error code lain supaya regression bug tetap muncul di CI.
# S4-E sudah migrasi `app.models.tenant` ke `Mapped[T]` style → dilepas dari list.
# Sprint berikutnya (S4-F+) akan migrasi model lain satu per satu.
[[tool.mypy.overrides]]
module = [
    "app.ai_engine.cloud_parser",
    "app.api.v1.admin",
    "app.api.v1.agregat",
    "app.api.v1.auth",
    "app.api.v1.dashboard",
    "app.api.v1.demo",
    "app.api.v1.kuitansi",
    "app.api.v1.laporan_gabungan",
    "app.api.v1.m8_managed",
    "app.api.v1.master",
    "app.api.v1.notifications",
    "app.api.v1.onboarding",
    "app.api.v1.pengeluaran",
    "app.api.v1.pengeluaran_ocr",
    "app.api.v1.pengeluaran_wa",
    "app.api.v1.quick_input",
    "app.api.v1.register",
    "app.api.v1.reports",
    "app.api.v1.scanner",
    "app.api.v1.sync",
    "app.api.v1.tenants",
    "app.api.v1.twofa",
    "app.api.v1.users",
    "app.api.v1.wa_input",
    "app.core.config",
    "app.core.upload_validator",
    "app.services.anonymizer",
    "app.services.branding_service",
    "app.services.notification_service",
    "app.services.pdf_gabungan",
    "app.services.pdf_generator",
    "app.services.retention_daemon",
    "app.services.tenant_service",
    "app.services.user_creator",
    "app.services.wa_input_parser",
    "app.services.wa_input_state",
    "app.services.whatsapp",
    "app.utils.sabat_counter",
]
# `arg-type`+`assignment` ONLY — error code lain (index, union-attr, dll)
# tetap dilaporkan agar regression bug tidak tersembunyi.
disable_error_code = ["arg-type", "assignment"]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/main.py",                # FastAPI bootstrap, exercised by integration
    "app/seed.py",
    "app/db/*_init.py",
    "app/migrations/*",
]
data_file = ".coverage"

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "pass",
    "\\.\\.\\.",
]

[tool.pytest.ini_options]
# FASE 3 Sprint 4: constrain discovery to tests/ to avoid collecting
# ad-hoc scripts in scripts/ and storage/scripts/ that lack fixtures.
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"
