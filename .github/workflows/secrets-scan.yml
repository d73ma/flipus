name: Secrets Scan

# FASE 5 Sprint 3 — secrets scanning via gitleaks.
#
# Runs on every push & PR. Blocks merges if any secret pattern
# (AWS, GitHub PAT, Stripe, generic API keys, JWT tokens, etc.) is
# detected in the diff or in the full git history.
#
# We use the official gitleaks-action (marketplace). No config file
# needed — gitleaks ships with a sensible ruleset out of the box and
# we extend it locally at `.gitleaks.toml` (FLIPUS-specific patterns
# for LICENSE_TENANT_SIGNATURE_SALT, PII_ENCRYPTION_KEY, etc.).

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  # Scheduled weekly scan — if someone bypasses branch protection
  # (e.g. direct push to main with admin override), the weekly scan
  # will still catch it within 7 days.
  schedule:
    - cron: '0 6 * * 1'   # every Monday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: secrets-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch full history so gitleaks can scan past commits
          # (not just the diff). Adds ~10s but catches secrets that
          # were committed and then removed in a later commit.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Path to the FLIPUS-specific extension ruleset.
          GITLEAKS_CONFIG: .gitleaks.toml
          # Don't fail on first push to a brand-new repo with no
          # historical secrets — only fail on new findings.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}