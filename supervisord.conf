# FLIPUS — supervisord main config (single-container).
# IMPORTANT: ini menggantikan /etc/supervisor/supervisord.conf (main config),
# BUKAN file di conf.d/. Harus ada [supervisord] nodaemon=true supaya
# supervisord tetap di foreground sebagai PID 1 — kalau daemonize, container
# langsung exit ("container is not running").

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

# uvicorn internal di port 8001 (BUKAN 8000) supaya tidak tabrakan dengan
# nginx yang listen di $PORT (sering juga 8000).
[program:uvicorn]
command=/usr/local/bin/uvicorn app.main:app --host 127.0.0.1 --port 8001 --workers 2
directory=/app
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
